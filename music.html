<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Our Song ❤️</title>


<style>

body {
    font-family: 'Poppins', sans-serif;
    background: #fff5f7;
    text-align: center;
    padding: 30px;
}


h1 {
    color: #ff4d6d;
}


.music-card {

    background: white;
    max-width: 500px;
    margin: 40px auto;
    padding: 30px;
    border-radius: 25px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.1);

}


.cover {

    width: 250px;
    height: 250px;
    object-fit: cover;
    border-radius: 20px;

}


.song-title {

    font-size: 25px;
    font-weight: bold;
    margin-top: 20px;

}


.artist {

    color: gray;
    margin-bottom: 20px;

}


audio {

    width: 100%;

}


.message {

    margin-top: 25px;
    font-size: 18px;
    color: #555;
    line-height: 1.5;

}


</style>

</head>


<body>


<h1>Song ❤️</h1>


<div class="music-card">


<img class="cover" src="images/song-cover.jpg">


<div class="song-title">
Chahvan sohneya
</div>


<div class="artist">
Danny
</div>


<audio controls>

<source src="assets/song.mp4" type="audio/mp3">

Your browser does not support audio.

</audio>



<div class="message">

"This song reminds me of u ❤️"

</div>


</div>



</body>

</html>
